<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>amine photos.com</title><style>
body{margin:0;background:#10131a;color:#fff;font-family:Arial}header{background:#193d63;padding:22px;text-align:center;position:sticky;top:0;z-index:3}h1{margin:0 0 12px}input{width:90%;max-width:720px;padding:14px;border:0;border-radius:12px;font-size:17px}#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:15px;padding:18px}.card{background:#202632;border-radius:14px;overflow:hidden}.card img{width:100%;height:175px;object-fit:cover;cursor:pointer}.info{padding:10px}.info button{width:100%;padding:11px;border:0;border-radius:9px;background:#328cff;color:white;font-weight:bold}#more{display:block;margin:0 auto 25px;padding:12px 30px;border:0;border-radius:10px;background:#328cff;color:#fff}.modal{display:none;position:fixed;inset:0;background:#000e;z-index:8;align-items:center;justify-content:center;flex-direction:column;padding:15px}.modal img{max-width:95%;max-height:75%}.modal button{padding:12px 25px;margin-top:12px;background:#328cff;color:white;border:0;border-radius:9px}.close{position:absolute;top:10px;right:22px;font-size:35px}
</style></head><body><header><h1>📸 amine photos.com</h1><input id="q" placeholder="قلب على أي حاجة: أسد، سيارة، مدينة..."><button onclick="search()">بحث 🔎</button></header><main id="grid"></main><button id="more" onclick="more()">عرض المزيد</button><div id="modal" class="modal"><span class="close" onclick="modal.style.display='none'">×</span><img id="big"><button id="save">تحميل الصورة</button></div>
<script>
let all=[],shown=0,offset=0;const starter=['cat','dog','lion','butterfly','car','train','castle','Morocco','mountain','city','forest','space','flower','ocean','bird','architecture','motorcycle','airplane','horse','dragon'];
function api(term,limit=50){return fetch('https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch='+encodeURIComponent(term)+'&gsrnamespace=6&gsrlimit='+limit+'&prop=imageinfo&iiprop=url|mime&iiurlwidth=700&format=json&origin=*').then(r=>r.json()).then(d=>Object.values(d.query?.pages||{}).filter(x=>x.imageinfo?.[0]?.mime?.startsWith('image/')))}
async function loadStarter(){grid.innerHTML='<p style="padding:20px">كنوجد 1000 صورة مختلفة...</p>';let chunks=[];for(let i=0;i<starter.length;i+=4)chunks.push(Promise.all(starter.slice(i,i+4).map(x=>api(x))));for(const c of chunks){all.push(...(await Promise.all(c)).flat());render()}all=all.filter((x,i,a)=>i===a.findIndex(y=>y.pageid===x.pageid));render()}
async function search(){let term=q.value.trim();if(!term)return;shown=0;all=await api(term,100);render()}
function render(){let list=all.slice(0,shown+60);grid.innerHTML=list.map((x,i)=>{let im=x.imageinfo[0];return `<article class="card"><img loading="lazy" src="${im.thumburl||im.url}" onclick="preview(${i})"><div class="info">${x.title.replace('File:','')}<br><button onclick="download('${im.url}','amine-photo-${i}.jpg')">تحميل</button></div></article>`}).join('');moreBtn()}
function more(){shown+=60;render()}function moreBtn(){moreEl=document.getElementById('more');moreEl.style.display=shown+60<all.length?'block':'none'}
function preview(i){let im=all[i].imageinfo[0];big.src=im.url;save.onclick=()=>download(im.url,'amine-photo.jpg');modal.style.display='flex'}
async function download(url,name){
  try{
    const r=await fetch(url,{mode:'cors'});
    if(!r.ok) throw new Error('download failed');
    const blob=await r.blob();
    const objectUrl=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=objectUrl; a.download=name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(objectUrl),1500);
  }catch(e){
    const a=document.createElement('a'); a.href=url; a.download=name; a.target='_blank'; a.rel='noopener';
    document.body.appendChild(a); a.click(); a.remove();
    alert('إلى ما تهبطاتش مباشرة، ضغط مطول على الصورة واختار تنزيل الصورة.');
  }
}
q.addEventListener('keydown',e=>{if(e.key==='Enter')search()});loadStarter();
</script></body></html>
